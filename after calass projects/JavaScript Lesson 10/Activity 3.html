<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Arrow Functions</h2>
       <P>This script shows an Arrow Function with a parameter<P>
        <p id="result"></p>
        <script>
            add= (a,b)=> a*b;
            document.getElementById("result").innerHTML = add(12,10);
        </script>
    </body>
</html>
