<!DOCTYPE html>

<html>

<head>

    <title>Simple Carousel</title>

    <style>
        body {

            background-color: greenyellow;

        }

        h1 {

            text-align: center;

            text-decoration: underline;

            text-transform: capitalize;

        }

        .carousel-container {

            display: flex;

            justify-content: center;

            align-items: center;

            height: 300px;

        }

        .myslides {

            display: none;

            max-height: 100%;

            max-width: 100%;

        }
    </style>

</head>

<body>

    <h1>My Favorite Disney Movies</h1>

    <div class="carousel-container">

        <img class="myslides" src="Spy n DIS.jpg" alt="slide1">

        <img class="myslides" src="Onward.jpg" alt="slide2">

        <img class="myslides" src="Big hero 6.jpg" alt="slide3">

        <img class="myslides" src="nemo f.jpg" alt="slide4">


    </div>

    <script src="Corousel.js"></script>

</body>

</html>
