<!DOCTYPE html>
<html>
    <body>

        <h1>JavaScript variables</h1>
        <p>Sum of three numbers</p>
        <p id="result"></p>

        <script>
            var num1= 4;
            var num2= 6;
            var num3= 9;
            var sum = num1+ num2 + num3;
            document.getElementById("result").innerHTML ="The total sum is: "+ sum;


        </script>
    </body>
</html>
