<!DOCTYPE html>
<html>

<body>
    <h3>JavaScript Statements</h3>

    <p>A <b>JavaScript program</b> is a list of<b> statements</b> to be executed by a computer.</p>

    <p id="demo"></p>

    <script>
        var x, y, z, r; // Statement 1
        x= 3; // Statement 2
        y= 9; // Statement 3
        z= 27; // Statement 4
        r = x + y * z; // Statement5

        document.getElementById("demo").innerHTML ="The vale of r is " + r + ".";
    </script>

</body>
</html>
