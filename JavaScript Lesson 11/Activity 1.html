<!DOCTYPE html>
<html>
    <body>
        <h2> JavaScript Promise</h2>
        <p id="demo"></p>
        <script>
            function myDisplayer(some) {
                document.getElementById("demo").innerHTML = some;
            }

            function sum(a,b){
                var sum = a+b;
                myDisplayer(sum);
            }

            let myPromise = new Promise(function(myResolve, myReject) {
                let x = 6;

                if (x == 6) {
                    myResolve("OK");
                } else {
                    myReject("Error");
                }
            }); 

            myPromise.then(
                function(value) {sum(67,67);},
                function(error) {sum(error);}
            );
        </script>
    </body>
</html>
