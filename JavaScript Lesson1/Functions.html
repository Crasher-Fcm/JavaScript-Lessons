<!DOCTYPE html>
<html>
    <head>
        <title>Basic Functions In JavaScript</title>

    </head>
    <body>

        <script>
            function myfunction(x,y)
            {
                if (y ===  undefined)
            {
                y = 2;
            }
            document.write( x + y );
        }

        </script>
        <button onclick="myfunction(5,20)">Execute JS function</button>
    </body>
</html>
