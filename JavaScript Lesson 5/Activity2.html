<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Array Methods</h2>
        <h2>join() and pop()</h2>
        <p>join() method joins array elements into a string and the pop () method removes the last elements from an array</p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var fruits = ["Yuzu", "Kiwi", "Papaya", "Lychee", "Dragonfruit", "Fig"];
            document.getElementById("myjoin").innerHTML= fruits.join("_")
            document.getElementById("myfirstpop").innerHTML = fruits; fruits.pop();

            document.getElementById("mysecondpop").innerHTML = fruits;
        </script>
    </body>
</html>
