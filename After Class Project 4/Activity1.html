<!DOCTYPE html>

<html>

<head>

    <title>Simple Carousel</title>

    <style>
        body {

            background-color: greenyellow;

        }

        h1 {

            text-align: center;

            text-decoration: underline;

            text-transform: capitalize;

        }

        .carousel-container {

            display: flex;

            justify-content: center;

            align-items: center;

            height: 300px;

        }

        .myslides {

            display: none;

            max-height: 100%;

            max-width: 100%;

        }
    </style>

</head>

<body>

    <h1>My Favorite Disney Movies</h1>

    <div class="carousel-container">

        <img class="myslides" src="Spy n DIS.jpg" alt="slide1">

        <img class="myslides" src="Onward.jpg" alt="slide2">

        <img class="myslides" src="Big hero 6.jpg" alt="slide3">

        <img class="myslides" src="nemo f.jpg" alt="slide4">

        <img class="myslides" src="Bluey.jpg" alt="slide5">

        <img class="myslides" src="Encanto.jpg" alt="slide6">

        <img class="myslides" src="Elenmental.jpg" alt="slide7">

        <img class="myslides" src="Te Croods.jpg" alt="slide8">

        <img class="myslides" src="Sofia te.jpg" alt="slide9">

        <img class="myslides" src="PJmasks.jpg" alt="slide10">

        <img class="myslides" src="Paw PAtrol.jpg" alt="slide11">
        

        


    </div>

    <script src="Carousel.js"></script>

</body>

</html>
